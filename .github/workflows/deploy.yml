name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image prefix
        run: |
          echo "IMAGE_PREFIX=$(echo ${{ env.IMAGE_PREFIX }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MinIO image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.minio
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/trackeado-minio:latest
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          build-args: |
            APP_VERSION=${{ env.SHORT_SHA }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/trackeado-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          build-args: |
            APP_VERSION=${{ env.SHORT_SHA }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/trackeado-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/trackeado-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer Webhooks
        run: |
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_API }}" ]; then
            curl -X POST "${{ secrets.PORTAINER_WEBHOOK_API }}"
            echo "API webhook triggered."
          fi
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_WORKER }}" ]; then
            curl -X POST "${{ secrets.PORTAINER_WEBHOOK_WORKER }}"
            echo "Worker webhook triggered."
          fi
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}" ]; then
            curl -X POST "${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}"
            echo "Frontend webhook triggered."
          fi
