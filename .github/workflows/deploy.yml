name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: minio
            context: ./backend
            file: ./backend/Dockerfile.minio
          - name: api
            context: ./backend
            file: ./backend/Dockerfile.api
          - name: worker
            context: ./backend
            file: ./backend/Dockerfile.worker
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image prefix
        run: |
          echo "IMAGE_PREFIX=$(echo ${{ env.IMAGE_PREFIX }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }} image (staged by SHA)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          build-args: |
            APP_VERSION=${{ env.SHORT_SHA }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/trackeado-${{ matrix.name }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-and-deploy:
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote all 4 images atomically to :latest
        run: |
          IMAGE_PREFIX=$(echo "${{ env.IMAGE_PREFIX }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for svc in minio api worker frontend; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}/trackeado-${svc}:latest" \
              "${IMAGE_PREFIX}/trackeado-${svc}:sha-${SHORT_SHA}"
          done

      - name: Trigger Portainer Webhooks
        run: |
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_API }}" ]; then
            curl -X POST "${{ secrets.PORTAINER_WEBHOOK_API }}"
            echo "API webhook triggered."
          fi
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_WORKER }}" ]; then
            curl -X POST "${{ secrets.PORTAINER_WEBHOOK_WORKER }}"
            echo "Worker webhook triggered."
          fi
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}" ]; then
            curl -X POST "${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}"
            echo "Frontend webhook triggered."
          fi
